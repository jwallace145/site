# Weekly dependency updates, grouped so a single PR covers all minor and
# patch bumps. The commit prefix + scope produce PR titles like
# `chore(deps): bump the npm-minor-and-patch group ...`, which pass commitlint
# and the PR title check.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # Opens a chore(deps) PR when the jwall-engineering registry module or the
  # AWS provider publishes a release. The plan comment on that PR shows what
  # the new version would change in AWS.
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: chore
      include: scope
