# Weekly dependency updates, grouped so a single PR covers all minor and
# patch bumps.
#
# npm and terraform bumps change what ships, so they use the `deps` type
# (`deps: bump the npm-minor-and-patch group ...`, no scope). release-please
# lists them under Dependencies and queues them for the next patch release.
# Actions bumps only touch CI, so they stay `chore(deps)` and ride along with
# the next release.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # Opens a `deps:` PR when the jwall-engineering registry module or the
  # AWS provider publishes a release. The plan comment on that PR shows what
  # the new version would change in AWS.
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    commit-message:
      prefix: deps
