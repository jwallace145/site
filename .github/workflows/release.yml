name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (defaults to the latest GitHub Release)
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.event_name == 'push'
    uses: jwallace145/jwall-engineering-infra/.github/workflows/site-release-please.yml@v0.10.1
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write

  tag:
    name: resolve tag
    needs: release-please
    if: >-
      !cancelled() &&
      (
        (github.event_name == 'push' &&
         needs.release-please.result == 'success' &&
         needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$RELEASE_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(gh release view --json tagName --jq .tagName)"
          fi
          if [ -z "$tag" ]; then
            echo "::error::Could not determine a release tag to deploy"
            exit 1
          fi
          echo "Deploying $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: refs/tags/${{ needs.tag.outputs.tag }}
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build
        env:
          SITE_URL: https://jwall.engineering
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: site
          path: dist
          retention-days: 1

  deploy:
    name: deploy
    needs: [tag, build]
    uses: jwallace145/jwall-engineering-infra/.github/workflows/site-deploy.yml@v0.10.1
    with:
      artifact: site
      tag: ${{ needs.tag.outputs.tag }}
      apply-role-arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
      site-url: https://jwall.engineering
    permissions:
      contents: read
      id-token: write # the apply role, through OIDC
