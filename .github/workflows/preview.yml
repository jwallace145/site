# Pull request previews: builds the Astro site for its preview hostname and
# hands it to the jwall-engineering-sites reusable workflow, which publishes it
# to https://pr-<n>.preview.jwall.engineering/ as the preview role and removes
# it when the pull request closes. Hashed assets under _astro/ are uploaded as
# immutable (site.immutable_paths in jwall-engineering-sites.yaml), HTML as
# must-revalidate, the rest with a short cache.
#
# Fork PRs receive no OIDC token, so the jobs only run for branches in this
# repository. Neither job declares a GitHub environment: the preview role
# trusts the `pull_request` OIDC subject, and an environment would change it.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build
        env:
          SITE_URL: https://pr-${{ github.event.pull_request.number }}.preview.jwall.engineering
      # actions/upload-artifact v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site
          path: dist
          retention-days: 1

  preview:
    name: preview
    needs: build
    if: >-
      !cancelled() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action == 'closed' || needs.build.result == 'success')
    uses: jwallace145/jwall-engineering-infra/.github/workflows/site-preview.yml@v0.8.0
    with:
      artifact: site
      preview-role-arn: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
    permissions:
      contents: read
      id-token: write # the preview role, through OIDC
      pull-requests: write # the sticky preview comment
