name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Verify static output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/_astro

  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint

  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # PRs are squash-merged with the PR title as the commit message, so the
      # title must itself be a valid one-line conventional commit.
      # amannn/action-semantic-pull-request v6.1.1
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Commitlint rule unit tests
        run: pnpm test
      - name: Lint PR commits
        # Early feedback for contributors. Only the PR title reaches main.
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect infra changes
        id: changes
        # This job always runs so it can be a required status check; the
        # Terraform steps only execute when infra/ changed in this PR.
        run: |
          if [ -d infra ] && ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- infra/; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "No changes under infra/, skipping Terraform checks."
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Setup Terraform
        if: steps.changes.outputs.infra == 'true'
        # hashicorp/setup-terraform v4.0.1
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - name: terraform fmt
        if: steps.changes.outputs.infra == 'true'
        run: terraform fmt -check -recursive -diff
        working-directory: infra

      - name: terraform init
        if: steps.changes.outputs.infra == 'true'
        run: terraform init -backend=false -input=false
        working-directory: infra/live

      - name: terraform validate
        if: steps.changes.outputs.infra == 'true'
        run: terraform validate -no-color
        working-directory: infra/live

  terraform-plan:
    name: terraform-plan
    runs-on: ubuntu-latest
    # Shows contributors what their infra change would do to prod before merge.
    # Fork PRs receive no OIDC token, so the job only runs for branches in
    # this repository; it is informational and not a required check.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      id-token: write # OIDC token for the read-only plan role
      pull-requests: write # sticky plan comment
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect infra changes
        id: changes
        run: |
          if [ -d infra ] && ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- infra/; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "No changes under infra/, skipping Terraform plan."
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Setup Terraform
        if: steps.changes.outputs.infra == 'true'
        # hashicorp/setup-terraform v4.0.1
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.14.7"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC, read-only plan role)
        if: steps.changes.outputs.infra == 'true'
        # aws-actions/configure-aws-credentials v6.3.0
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-plan-pr${{ github.event.pull_request.number }}

      - name: terraform init
        if: steps.changes.outputs.infra == 'true'
        run: terraform init -input=false
        working-directory: infra/live

      - name: terraform plan
        if: steps.changes.outputs.infra == 'true'
        id: plan
        # -lock=false: the plan role can read state but never writes the lock.
        # -detailed-exitcode: 0 = no changes, 2 = changes, 1 = error.
        run: |
          set +e
          terraform plan -input=false -lock=false -no-color -detailed-exitcode -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          cat plan.log
          if [ "$code" = "1" ]; then exit 1; fi
          terraform show -no-color tfplan > plan.txt
        working-directory: infra/live
        env:
          TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}

      - name: Comment plan on PR
        if: steps.changes.outputs.infra == 'true' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          EXITCODE: ${{ steps.plan.outputs.exitcode }}
        run: |
          marker='<!-- terraform-plan:infra/live -->'
          case "$EXITCODE" in
            0) status='No changes. Prod matches this branch.' ;;
            2) status="$(grep -E '^Plan:' infra/live/plan.txt || echo 'Changes detected.')" ;;
            *) status='Plan failed. See the job log.' ;;
          esac
          body_file=$(mktemp)
          {
            echo "$marker"
            echo "## Terraform plan (\`infra/live\`) for $SHA"
            echo
            echo "**$status**"
            echo
            if [ -s infra/live/plan.txt ]; then
              echo '<details><summary>Full plan</summary>'
              echo
              echo '```hcl'
              head -c 60000 infra/live/plan.txt
              echo
              echo '```'
              echo '</details>'
            elif [ -s infra/live/plan.log ]; then
              echo '```'
              tail -c 20000 infra/live/plan.log
              echo '```'
            fi
          } > "$body_file"
          existing=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate             --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$existing" -F body=@"$body_file" >/dev/null
          else
            gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@"$body_file" >/dev/null
          fi
          cat "$body_file" >> "$GITHUB_STEP_SUMMARY"
