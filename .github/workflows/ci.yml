name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Verify static output
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -d dist/_astro

      - name: Build under a base path (PR previews)
        # Previews are served from /pr-<n>/. Any root-relative link that
        # ignores Astro's `base` would 404 there, so fail fast here.
        run: |
          BASE_PATH=/pr-0 pnpm build
          leaks=$(grep -rEoh '(href|src)="/[^"]*' --include='*.html' dist | grep -vE '^(href|src)="/pr-0(/|$)' || true)
          if [ -n "$leaks" ]; then
            echo "$leaks"
            echo "::error::Root-relative link(s) above ignore BASE_PATH; wrap them with withBase()"
            exit 1
          fi

  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check

  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm format:check
      - run: pnpm lint

  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # PRs are squash-merged with the PR title as the commit message, so the
      # title must itself be a valid one-line conventional commit.
      # amannn/action-semantic-pull-request v6.1.1
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Commitlint rule unit tests
        run: pnpm test
      - name: Lint PR commits
        # Early feedback for contributors. Only the PR title reaches main.
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  plan:
    name: plan
    # The jwall-engineering-sites CLI validates jwall-engineering-sites.yaml
    # and plans the infrastructure as the plan role; the plan is a sticky PR
    # comment. Fork PRs receive no OIDC token.
    if: >-
      github.event.action != 'edited' &&
      github.event.pull_request.head.repo.full_name == github.repository
    uses: jwallace145/jwall-engineering-infra/.github/workflows/site-plan.yml@v0.8.0
    with:
      plan-role-arn: ${{ vars.AWS_PLAN_ROLE_ARN }}
    permissions:
      contents: read
      id-token: write # the plan role, through OIDC
      pull-requests: write # the sticky plan comment
